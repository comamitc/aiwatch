[package]
name = "aiwatch"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A local-first terminal dashboard for Claude Code, Codex, and Grok usage limits"
license = "MIT"
repository = "https://github.com/comamitc/aiwatch"
keywords = ["tui", "claude", "codex", "grok", "usage"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "6.0"
futures = "0.3"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
zeroize = "1.8"

[target.'cfg(target_os = "macos")'.dependencies]
sha2 = "0.10"
security-framework = "3.7"

[dev-dependencies]
tempfile = "3.15"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
